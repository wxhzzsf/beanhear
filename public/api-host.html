  <h1>BeanHear API</h1>
  <p>Host <code>api.beanhear.com</code> — public HTTPS endpoints only.</p>
  <ul>
    <li><code>POST /assn</code> — App Store Server Notifications v2</li>
    <li><code>/inngestServe</code> — Inngest serve/sync</li>
  </ul>
  <p>Firebase callable Functions stay on the default Functions host via the iOS SDK.</p>
